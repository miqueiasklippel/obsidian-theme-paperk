name: Publicar release

# Cria a release no GitHub sempre que uma tag de versão (ex.: 1.0.0) é enviada.
# A tag deve ser igual ao campo "version" do manifest.json, sem o prefixo "v".
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Conferir se a tag corresponde ao manifest.json
        run: |
          versao=$(jq -r .version manifest.json)
          if [ "$versao" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} difere da versão ${versao} do manifest.json."
            exit 1
          fi

      - name: Criar a release com o manifest.json e o theme.css
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" manifest.json theme.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "PaperK ${GITHUB_REF_NAME} — tema de papel antigo e pergaminho para o Obsidian, com os modos claro (Pergaminho) e escuro (Couro & Vela)."
