name: Publicar release

# A cada envio ao branch main, lê a versão do manifest.json e, se ainda não
# existir uma release com esse número, cria a tag e a release (sem prefixo "v"),
# anexando o manifest.json e o theme.css, como o Obsidian exige.
# Para lançar uma nova versão, basta atualizar o campo "version" do manifest.json.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Ler a versão do manifest.json
        id: versao
        run: echo "valor=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Criar a release, se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          if gh release view "$VERSAO" > /dev/null 2>&1; then
            echo "A release $VERSAO já existe; nada a fazer."
            exit 0
          fi
          gh release create "$VERSAO" manifest.json theme.css \
            --target "$GITHUB_SHA" \
            --title "$VERSAO" \
            --notes "PaperK $VERSAO — tema de papel antigo e pergaminho para o Obsidian, com os modos claro (Pergaminho) e escuro (Couro & Vela)."
